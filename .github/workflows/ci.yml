name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: for f in test/*.rb; do ruby -Ilib -Itest "$f"; done
      - run: printf 'my name is Ana\ni feel great\nbye\n' | ruby bin/chat
